name: Weekly growth intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  search-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_OUTDOORS_HOST: michiganoutdoorsnow.chrisizworski.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check Search Console configuration
        id: gsc
        shell: bash
        run: |
          if [ -n "${GSC_SERVICE_ACCOUNT_JSON}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Search Console collection is not active because GSC_SERVICE_ACCOUNT_JSON is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch complete Search Console window
        if: steps.gsc.outputs.configured == 'true'
        run: node scripts/fetch-search-console.mjs --output artifacts/growth/search-console-latest.json

      - name: Build growth opportunity report
        if: steps.gsc.outputs.configured == 'true'
        run: |
          npm run report:growth -- --search artifacts/growth/search-console-latest.json --product data/growth/product-events-baseline.json | tee artifacts/growth/growth-report.txt

      - name: Upload growth intelligence artifact
        if: steps.gsc.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: outdoors-now-growth-intelligence
          path: artifacts/growth/
          retention-days: 45
