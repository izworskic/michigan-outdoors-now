name: Add local authority GIS expansion

on:
  push:
    branches: [feature/local-authority-gis]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-authority-gis
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply local authority wiring
        run: python .github/scripts/apply-local-authority-wiring.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Runtime gate
        run: npm run check:runtime

      - name: Commit verified expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/discovery.ts src/lib/authoritative-discovery.ts src/app/api/discover/route.ts src/lib/local-authority-discovery.ts tests/local-authority-discovery.test.ts
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Add direct local authority outdoor GIS sources"
            git push origin HEAD:feature/local-authority-gis
          fi
