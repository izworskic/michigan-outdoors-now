name: Finalize local authority GIS expansion

on:
  push:
    branches: [feature/local-authority-gis]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-authority-gis
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply validated local authority wiring
        run: python .github/scripts/apply-local-authority-wiring.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Runtime gate
        run: npm run check:runtime

      - name: Live local GIS smoke
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { interpretOutdoorQuery } from './src/lib/discovery.ts';
          import { fetchLocalAuthorityDiscoveryPlaces } from './src/lib/local-authority-discovery.ts';

          const intent = interpretOutdoorQuery('parks trails fishing swimming');
          const origins = [
            { name: 'Detroit', latitude: 42.3314, longitude: -83.0458, maxDriveHours: 2 },
            { name: 'Grand Rapids', latitude: 42.9634, longitude: -85.6681, maxDriveHours: 2 },
          ];
          let total = 0;
          const summary = [];
          for (const origin of origins) {
            const results = await fetchLocalAuthorityDiscoveryPlaces({
              originLatitude: origin.latitude,
              originLongitude: origin.longitude,
              maxDriveHours: origin.maxDriveHours,
              minDriveHours: 0,
              intent,
            });
            const rows = results.map((r) => ({ id: r.id, status: r.status, count: r.places.length }));
            total += rows.reduce((sum, row) => sum + row.count, 0);
            summary.push({ origin: origin.name, rows });
          }
          console.log(JSON.stringify(summary, null, 2));
          if (total < 1) throw new Error('Direct local-authority GIS smoke returned no outdoor places');
          NODE

      - name: Build clean verified branch
        run: |
          rm -f .github/scripts/apply-local-authority-wiring.py
          rm -f .github/workflows/add-local-authority-gis.yml
          rm -f .github/workflows/finalize-local-authority-gis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add direct local authority outdoor GIS sources"
          git push origin HEAD:feature/local-authority-gis-verified
