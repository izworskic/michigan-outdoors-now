name: Apply selected-place depth

on:
  push:
    branches: [feature/place-depth-v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/place-depth-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused UI and runtime patch
        run: |
          sed -i 's/"place_depth_map_focus"/"outbound_map_opened"/g; s/"place_depth_companion_opened"/"semantic_result_opened"/g' src/components/place-depth-panel.tsx
          node scripts/apply-place-depth.mjs
      - name: Verify focused release
        run: npm run lint && npm run test && npm run build
      - name: Commit verified integration
        run: |
          rm scripts/apply-place-depth.mjs .github/workflows/apply-place-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add selected-place access and companion depth"
          git push origin HEAD:feature/place-depth-v2
