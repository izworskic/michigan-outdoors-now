name: Expand deterministic outdoor location inventory

on:
  push:
    branches:
      - feature/more-outdoor-locations
    paths:
      - .github/workflows/expand-more-locations.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/more-outdoor-locations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply location expansion
        run: python scripts/expand-more-locations.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Runtime gate
        run: npm run check:runtime
      - name: Commit verified expansion
        shell: bash
        run: |
          rm .github/workflows/expand-more-locations.yml scripts/expand-more-locations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/discovery.ts src/lib/authoritative-discovery.ts src/app/api/discover/route.ts tests/authoritative-discovery.test.ts .github/workflows/expand-more-locations.yml scripts/expand-more-locations.py
          git commit -m "Add more deterministic outdoor location sources"
          git push origin HEAD:feature/more-outdoor-locations
