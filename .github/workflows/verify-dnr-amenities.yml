name: Verify live DNR recreation amenities

on:
  push:
    branches: [feature/conservation-amenities]

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conservation-amenities
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose DNR amenity inventory
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRReferenceAssetsOPENDATA/FeatureServer/7/query';
          async function query(label, params) {
            const url = `${base}?${new URLSearchParams(params)}`;
            const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
            const text = await response.text();
            console.log(`--- ${label} ---`);
            console.log('STATUS', response.status);
            console.log(text.slice(0, 12000));
          }
          await query('GLOBAL COUNT', {
            where: "ASSETTYPE='Recreation Amenity'",
            returnCountOnly: 'true',
            f: 'json',
          });
          await query('GLOBAL SAMPLE', {
            where: "ASSETTYPE='Recreation Amenity'",
            outFields: 'OBJECTID,ASSETTYPE,ASSETDETAILTYPE,ADMINBY,MAINTBY,ESRIGNSS_LATITUDE,ESRIGNSS_LONGITUDE',
            returnGeometry: 'true',
            outSR: '4326',
            resultRecordCount: '5',
            f: 'geojson',
          });
          const units = [
            'Bay City State Recreation Area',
            'Rifle River Recreation Area',
            'Hartwick Pines State Park',
            'Tawas Point State Park',
          ];
          const quoted = units.map(v => `'${v.replaceAll("'", "''")}'`).join(',');
          await query('KNOWN UNITS', {
            where: `ASSETTYPE='Recreation Amenity' AND (ADMINBY IN (${quoted}) OR MAINTBY IN (${quoted}))`,
            outFields: 'OBJECTID,ASSETTYPE,ASSETDETAILTYPE,DESCRIP,CONDITION,ADMINBY,MAINTBY,ESRIGNSS_LATITUDE,ESRIGNSS_LONGITUDE',
            returnGeometry: 'true',
            outSR: '4326',
            resultRecordCount: '50',
            f: 'geojson',
          });
          NODE
