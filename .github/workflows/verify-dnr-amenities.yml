name: Verify live DNR recreation amenities

on:
  push:
    branches: [feature/conservation-amenities]

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conservation-amenities
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose raw DNR amenity query
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRReferenceAssetsOPENDATA/FeatureServer/7/query';
          async function query(params) {
            const url = `${base}?${new URLSearchParams(params)}`;
            const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
            const text = await response.text();
            console.log('STATUS', response.status, url);
            console.log(text.slice(0, 6000));
          }
          await query({
            where: "ASSETTYPE='Recreation Amenity'",
            outFields: 'OBJECTID,ASSETTYPE,ASSETDETAILTYPE,ADMINBY,MAINTBY,ESRIGNSS_LATITUDE,ESRIGNSS_LONGITUDE',
            returnGeometry: 'true',
            outSR: '4326',
            resultRecordCount: '5',
            f: 'json',
          });
          const lat = 44.7468, lon = -84.6636, miles = 5;
          const latSpan = miles / 69;
          const lonSpan = miles / Math.max(20, 69 * Math.cos((lat * Math.PI) / 180));
          const bounds = [lon-lonSpan, lat-latSpan, lon+lonSpan, lat+latSpan];
          await query({
            where: "ASSETTYPE='Recreation Amenity'",
            geometry: bounds.map(v => v.toFixed(5)).join(','),
            geometryType: 'esriGeometryEnvelope',
            inSR: '4326',
            spatialRel: 'esriSpatialRelIntersects',
            outFields: 'OBJECTID,ASSETTYPE,ASSETDETAILTYPE,ADMINBY,MAINTBY,ESRIGNSS_LATITUDE,ESRIGNSS_LONGITUDE',
            returnGeometry: 'true',
            outSR: '4326',
            resultRecordCount: '20',
            f: 'geojson',
          });
          NODE
