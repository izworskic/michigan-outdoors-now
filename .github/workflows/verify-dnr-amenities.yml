name: Remove sparse DNR amenity experiment

on:
  push:
    branches: [feature/conservation-amenities]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conservation-amenities
          fetch-depth: 0
      - name: Keep conservation expansion and remove weak amenity layer
        run: |
          git fetch origin main
          git checkout origin/main -- src/lib/place-intelligence.ts scripts/runtime-check.mjs src/components/outdoor-intent-hub.tsx
          rm -f tests/recreation-amenities.test.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/outdoor-intent-hub.tsx')
          text = path.read_text()
          old = '<small>{activeDiscovery.source === "OpenStreetMap" ? "Live mapped place from OpenStreetMap contributors." : "Curated Michigan Outdoors Now destination."}</small>'
          new = '<small>{activeDiscovery.curatedPlaceId ? "Curated Michigan Outdoors Now destination with full planning depth." : activeDiscovery.source === "OpenStreetMap" ? "Live mapped place from OpenStreetMap contributors." : `${activeDiscovery.source} mapped source. Verify current access, hours and local rules before departure.`}</small>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one provenance line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/verify-dnr-amenities.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep open-access conservation expansion and source provenance"
          git push origin HEAD:feature/conservation-amenities
