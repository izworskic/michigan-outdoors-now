name: Apply outdoor location expansion

on:
  push:
    branches:
      - feature/expand-outdoor-locations

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expand-outdoor-locations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair literal template markers in one-time patcher
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-place-source-expansion.mjs')
          content = path.read_text()
          content = content.replace('fetch(\\`${USFS_RECREATION}?', 'fetch(\\`\\${USFS_RECREATION}?')
          content = content.replace('fetch(\\`${NPS_BOUNDARIES}?', 'fetch(\\`\\${NPS_BOUNDARIES}?')
          path.write_text(content)
          PY
      - name: Apply source expansion
        run: node scripts/apply-place-source-expansion.mjs
      - name: Finish expanded map tag classification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/lib/discovery.ts';
          let content = fs.readFileSync(path, 'utf8');
          function replaceOnce(search, replacement, label) {
            const first = content.indexOf(search);
            if (first < 0) throw new Error(`Patch target not found: ${label}`);
            if (content.indexOf(search, first + search.length) >= 0) throw new Error(`Patch target not unique: ${label}`);
            content = content.slice(0, first) + replacement + content.slice(first + search.length);
          }
          replaceOnce(
            '  if (tags.canoe === "put_in" || tags.waterway === "access_point" || tags.leisure === "slipway") return "paddling";',
            '  if (\n    tags.canoe === "put_in" ||\n    tags.waterway === "access_point" ||\n    tags.leisure === "slipway" ||\n    tags.leisure === "marina" ||\n    tags.man_made === "pier" ||\n    Boolean(tags.harbour)\n  ) return "paddling";',
            'paddling tag classification',
          );
          replaceOnce(
            '  if (tags.leisure === "nature_reserve") return "wildlife";',
            '  if (tags.leisure === "nature_reserve" || tags.leisure === "bird_hide") return "wildlife";',
            'wildlife tag classification',
          );
          fs.writeFileSync(path, content);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified source changes
        shell: bash
        run: |
          rm scripts/apply-place-source-expansion.mjs
          rm .github/workflows/apply-outdoor-location-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/discovery.ts src/lib/authoritative-discovery.ts src/app/api/discover/route.ts tests/authoritative-discovery.test.ts scripts/apply-place-source-expansion.mjs .github/workflows/apply-outdoor-location-expansion.yml
          git commit -m "Expand Michigan outdoor location sources"
          git push origin HEAD:feature/expand-outdoor-locations
