name: Validate release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run deterministic tests
        run: npm run test

      - name: Verify live specialist links
        run: npm run check:specialists

      - name: Score core planner flow
        run: npm run score:core-flow

      - name: Build production output
        run: npm run build

      - name: Verify generated SEO output
        run: npm run check:seo

      - name: Verify runtime behavior
        run: npm run check:runtime

      - name: Score usefulness
        run: npm run score:usefulness

      - name: Score search readiness
        run: npm run score:search

      - name: Score impact readiness
        run: npm run score:impact

      - name: Score platform quality
        run: npm run score:platform

      - name: Score interface loss
        run: npm run score:interface
