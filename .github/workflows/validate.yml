name: Validate release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run deterministic tests
        run: npm run test

      - name: Verify live specialist links
        run: npm run check:specialists

      - name: Score core planner flow
        run: npm run score:core-flow

      - name: Score result flow refinement
        run: npm run score:result-flow

      - name: Score persona-led taste
        run: npm run score:persona-taste

      - name: Score decision depth
        run: npm run score:decision-depth

      - name: Score field confidence
        run: npm run score:field-confidence

      - name: Score skeptic conversion
        run: npm run score:skeptic-conversion

      - name: Score organic search growth
        run: npm run score:organic-growth

      - name: Score growth operating system
        run: npm run score:growth-system

      - name: Score Trail Decision Stack
        run: npm run score:trail-stack

      - name: Score live opportunity detection
        run: npm run score:opportunity

      - name: Score My Outdoors continuity
        run: npm run score:my-outdoors

      - name: Score My Outdoors return-visit changes
        run: npm run score:return-changes

      - name: Build production output
        run: npm run build

      - name: Verify generated SEO output
        run: npm run check:seo

      - name: Verify runtime behavior
        run: npm run check:runtime

      - name: Score usefulness
        run: npm run score:usefulness

      - name: Score search readiness
        run: npm run score:search

      - name: Score impact readiness
        run: npm run score:impact

      - name: Score platform quality
        run: npm run score:platform

      - name: Score interface loss
        run: npm run score:interface
