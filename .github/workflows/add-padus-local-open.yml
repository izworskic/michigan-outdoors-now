name: Add PAD-US local protected lands

on:
  push:
    branches:
      - feature/padus-local-open
    paths:
      - .github/workflows/add-padus-local-open.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/padus-local-open
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply PAD-US expansion
        run: python scripts/add-padus-local-open.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Deterministic tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Runtime gate
        run: npm run check:runtime
      - name: Commit verified expansion
        shell: bash
        run: |
          rm .github/workflows/add-padus-local-open.yml scripts/add-padus-local-open.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PAD-US open-access local protected lands"
          git push origin HEAD:feature/padus-local-open
